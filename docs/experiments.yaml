                  en: "The published number does not move. Older models stay «macro provenance not verifiable» — **deliberately**: a fingerprint recomputed today would match by construction and turn an honest «unknown» into a reassuring «identical». Declared limit: the positive control is synthetic; it shows the guard tells two vintages apart, not that it would have caught the historical one."}
