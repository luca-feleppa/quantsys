    scope: riproducibilita
    status: chiuso
    dates: {prereg: 2026-08-03, closed: 2026-08-04}
    question: {it: "Il numeratore della banda veniva da una coppia modello/dataset poi cancellata. Riaddestrando a configurazione di produzione invariata sul dataset congelato, si riottiene lo stesso numero — e si può conservarlo come artefatto verificabile?",
               en: "The band's numerator came from a model/dataset pair later deleted. Retraining at unchanged production config on the frozen dataset, is the same number recovered — and can it be kept as a verifiable artifact?"}
    prior: {it: "La spiegazione scritta prima del run: circa due decimi di incertezza da sorteggio del seed, dedotti dallo scarto fra due repliche.",
            en: "The explanation written before the run: about two tenths of seed-draw uncertainty, inferred from the gap between two replicas."}
    lever: {it: "nessuna: riaddestramento a configurazione invariata, più un braccio diagnostico su un parametro puramente computazionale",
            en: "none: retraining at unchanged config, plus a diagnostic arm on a purely computational parameter"}
    threshold: {it: "baseline riprodotte cifra per cifra, identità dello scaler verificata senza vie di fuga, gate storico e soglie di materialità rispettati",
                en: "baselines reproduced digit for digit, scaler identity verified with no escape hatch, historical gate and materiality thresholds met"}
    split: val+test
    verdict: PASS
    numbers:
      source: results/vols/qlike_report_1h_test_canonical_1h_vols.json
      keys:
        - {label: {it: "QLIKE modello (test)", en: "model QLIKE (test)"}, path: metrics.nn.qlike}
        - {label: {it: "QLIKE HAR-C (test)", en: "HAR-C QLIKE (test)"}, path: har_cj.har_c.qlike_har_c}
        - {label: {it: "QLIKE HAR-RV (test)", en: "HAR-RV QLIKE (test)"}, path: metrics.har.qlike}
        - {label: {it: "QLIKE persistenza (test)", en: "naive QLIKE (test)"}, path: metrics.naive.qlike}
        - {label: {it: "osservazioni", en: "observations"}, path: gate.n_obs}
        - {label: {it: "identità dello scaler", en: "scaler identity"}, path: provenance.matches}
    consequence: {it: "La banda pubblicata non cambia di una cifra: il numeratore coincide **esattamente** (val 0.26143, test 0.23637), e il prior è sbagliato in modo utile — a seed fissi il protocollo è **deterministico**, lo scarto fra repliche era una differenza di dati, non rumore. Cambia lo **statuto** del claim: da affermazione su un protocollo ad artefatto ri-giudicabile. ⚠ Il PASS non autorizza a sostituire il modello live mentre ci sono campioni forward aperti.",
                  en: "The published band does not change by a digit: the numerator matches **exactly** (val 0.26143, test 0.23637), and the prior is wrong in a useful way — at fixed seeds the protocol is **deterministic**, the gap between replicas was a data difference, not noise. What changes is the claim's **status**: from a statement about a protocol to a re-judgeable artifact. ⚠ The PASS does not authorize swapping the live model while forward samples are open."}
    teoria: "12.2"
    data_state: riproducibile

