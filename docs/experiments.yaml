  # ─────────────────────── short-vol arm ───────────────────────
  - id: gate-v1-shortvol
    name: {it: "Gate v1 — la regola di ingresso monetizza il premio di rischio?",
           en: "Gate v1 — does the entry rule monetize the risk premium?"}
    line: short-vol
    scope: realizzazione
    status: chiuso
    dates: {prereg: 2026-06-12, closed: 2026-07-30}
    question: {it: "Confrontando varianza prevista e varianza implicita, una regola a soglia produce PnL positiva in forward test?",
               en: "Comparing forecast and implied variance, does a threshold rule produce positive PnL in forward testing?"}
    prior: {it: "Favorevole: il premio di rischio di varianza è strutturalmente positivo e confermato dal backtest storico.",
            en: "Favourable: the variance risk premium is structurally positive and confirmed by the historical backtest."}
    lever: {it: "regola a soglia su `log(varianza prevista / varianza implicita)`",
            en: "threshold rule on `log(forecast variance / implied variance)`"}
    threshold: {it: "3 criteri pre-registrati, n ≥ 30", en: "3 pre-registered criteria, n ≥ 30"}
    split: forward
    verdict: FAIL
    numbers:
      source: results/vol_paper/baseline_report.json
      keys:
        - {label: {it: "posizioni eseguite", en: "executed positions"}, path: real_trades.n_executed}
        - {label: {it: "criterio 1 — PnL media > 0", en: "criterion 1 — mean PnL > 0"}, path: gates.g1_real_mean_pnl_gt_0}
        - {label: {it: "criterio 2 — batte le baseline", en: "criterion 2 — beats the baselines"}, path: gates.g2_nn_beats_both_baselines}
        # list form: the key itself contains a dot
        - {label: {it: "criterio 3 — hit rate > 0.5", en: "criterion 3 — hit rate > 0.5"}, path: [gates, "g3_real_hit_rate_gt_0.5"]}
    consequence: {it: "FAIL 0/3, e i due campioni concordano. Ma la baseline che vende sempre volatilità è **positiva**: il premio di rischio c'è, la regola non lo monetizza. Distinzione permanente del progetto — *skill predittiva misurata* ≠ *monetizzazione*.",
                  en: "FAIL 0/3, with both samples agreeing. Yet the always-sell-volatility baseline is **positive**: the risk premium exists, the rule does not monetize it. A permanent project distinction — *measured predictive skill* ≠ *monetization*."}
    teoria: "12.2"
    data_state: non-rigenerabile
    data_note: {it: "Forward test su testnet: i trade non sono ricostruibili a posteriori dall'API.",
                en: "Forward test on testnet: the trades cannot be reconstructed from the API afterwards."}

  - id: hedged-vs-unhedged
    name: {it: "V2 — il delta-hedge migliora il braccio short-vol?", en: "V2 — does delta-hedging improve the short-vol arm?"}
    line: short-vol
    scope: realizzazione
    status: chiuso
    dates: {prereg: 2026-07-12, closed: 2026-08-11}
    question: {it: "Neutralizzare l'esposizione direzionale con il perpetuo purifica il premio di varianza, o il costo di ribilanciamento se lo mangia?",
               en: "Does neutralizing directional exposure with the perpetual purify the variance premium, or does rebalancing cost eat it?"}
    prior: {it: "Incerto: è precisamente un compromesso fra riduzione di varianza e costo di realizzazione, con il funding come grande incognita mai misurata.",
            en: "Uncertain: it is precisely a trade-off between variance reduction and realization cost, with funding as the big never-measured unknown."}
    lever: {it: "banda di ribilanciamento fissa, congelata dalla pre-registrazione", en: "fixed rebalancing band, frozen by the pre-registration"}
    threshold: {it: "① varianza ≤ 0.6× quella senza hedge; ② costo medio entro 0.25 errori standard; ③ n ≥ 20 posizioni con hedge attivo",
                en: "① variance ≤ 0.6× the unhedged one; ② mean cost within 0.25 standard errors; ③ n ≥ 20 hedge-active positions"}
    split: forward
    verdict: FAIL
    numbers:
      source: results/vols/hedged_vs_unhedged.json
      keys:
        - {label: {it: "posizioni", en: "positions"}, path: n_hedged_settlements}
        - {label: {it: "rapporto di varianza", en: "variance ratio"}, path: aggregates.var_ratio}
        - {label: {it: "PnL media senza hedge (BTC)", en: "mean PnL unhedged (BTC)"}, path: aggregates.mean_unhedged}
        - {label: {it: "PnL media con hedge (BTC)", en: "mean PnL hedged (BTC)"}, path: aggregates.mean_hedged}
        - {label: {it: "fee perp totali (BTC)", en: "total perp fees (BTC)"}, path: aggregates.fees_perp_total}
        - {label: {it: "funding totale (BTC)", en: "total funding (BTC)"}, path: aggregates.funding_paid_total}
        - {label: {it: "① varianza", en: "① variance"}, path: ["conditions", "1_var_ratio_le_0.6"]}
        - {label: {it: "② costo", en: "② cost"}, path: conditions.2_mean_drag_le_quarter_se}
    consequence: {it: "FAIL 2/3. La varianza scende del 55% — l'hedge fa esattamente ciò che la teoria prometteva — ma il costo è 2.6× il budget, e **per il 76% sono fee del perpetuo**: il funding, l'incognita dichiarata, pesa meno dell'1%. L'ipotesi muore sul **costo di realizzazione, non sulla teoria**. ⚠ Il criterio ② è un budget, non un test di significatività: il drag non è dimostrato negativo in popolazione. La versione senza hedge resta il design di produzione.",
                  en: "FAIL 2/3. Variance drops by 55% — the hedge does exactly what theory promised — but the cost is 2.6× the budget, and **76% of it is perpetual fees**: funding, the declared unknown, weighs under 1%. The hypothesis dies on **realization cost, not on theory**. ⚠ Criterion ② is a budget, not a significance test: the drag is not shown to be negative in population. The unhedged version remains the production design."}
    teoria: "12.2"
    data_state: non-rigenerabile
    data_note: {it: "Forward test su testnet: fill e ribilanciamenti non sono ricostruibili a posteriori.",
                en: "Forward test on testnet: fills and rebalances cannot be reconstructed afterwards."}

  - id: mfiv-v2
    name: {it: "MFIV v2 — il comparatore model-free ordina meglio dell'ATM?", en: "MFIV v2 — does the model-free comparator rank better than ATM?"}
    line: short-vol
    scope: metodo
    status: chiuso
    dates: {prereg: 2026-07-20, closed: 2026-08-18}
    question: {it: "La volatilità implicita at-the-money sottostima il tasso di var-swap per convessità dello smile. Un comparatore model-free ordina meglio le occasioni?",
               en: "At-the-money implied volatility understates the var-swap rate through smile convexity. Does a model-free comparator rank opportunities better?"}
    prior: {it: "Favorevole in teoria — il cuneo di convessità è misurato e positivo — ma è un'ipotesi sull'**ordinamento**, non sul livello: se il cuneo fosse costante, i due ranghi sarebbero identici per costruzione.",
            en: "Favourable in theory — the convexity wedge is measured and positive — but it is a hypothesis about **ranking**, not level: were the wedge constant, the two rankings would be identical by construction."}
    lever: {it: "sostituzione del comparatore, il modello non cambia", en: "comparator substitution, the model is unchanged"}
    threshold: {it: "① differenza di correlazione di rango ≥ +0.05; ② segno coerente fra le due metà; ③ n ≥ 40 scadenze appaiate",
                en: "① rank-correlation difference ≥ +0.05; ② consistent sign across the two halves; ③ n ≥ 40 paired expiries"}
    split: forward
    verdict: FAIL
    numbers:
      source: results/vols/mfiv_comparator_report.json
      keys:
        - {label: {it: "scadenze", en: "expiries"}, path: n}
        - {label: {it: "ρ ATM", en: "ρ ATM"}, path: rho_atm}
        - {label: {it: "ρ MFIV", en: "ρ MFIV"}, path: rho_mfiv}
        - {label: {it: "Δρ", en: "Δρ"}, path: delta_rho}
        - {label: {it: "Δρ prima metà", en: "Δρ first half"}, path: delta_rho_half1}
        - {label: {it: "Δρ seconda metà", en: "Δρ second half"}, path: delta_rho_half2}
        - {label: {it: "cuneo log-varianza, mediana", en: "log-variance wedge, median"}, path: descr_log_wedge_median}
    consequence: {it: "FAIL, previsto dalla pre-registrazione stessa: il cuneo è **grande ma quasi costante**, e l'invarianza di rango lo rende invisibile a una correlazione di rango. Il comparatore live resta l'ATM; la MFIV resta colonna diagnostica. Il valore permanente è descrittivo: la MFIV prezza la varianza circa il 22% sopra l'ATM, quindi il margine di sicurezza del braccio short-vol è più largo di quanto l'ATM suggerisse — **non** è PnL in più, perché la posizione vende lo straddle ATM.",
                  en: "FAIL, predicted by the pre-registration itself: the wedge is **large but nearly constant**, and rank invariance makes it invisible to a rank correlation. The live comparator stays ATM; MFIV remains a diagnostic column. The permanent value is descriptive: MFIV prices variance about 22% above ATM, so the short-vol arm's cushion is wider than ATM suggested — **not** extra PnL, since the position sells the ATM straddle."}
    teoria: "12.2"
    data_state: non-rigenerabile
    data_note: {it: "Catena di opzioni raccolta in avanti: non ricostruibile a posteriori.",
                en: "Option chain collected forward: not reconstructible afterwards."}

  - id: e1
    name: {it: "E1 — l'edge batte la previsione del mercato?",
           en: "E1 — does the edge beat the market's own forecast?"}
    line: short-vol
    scope: segnale
    status: chiuso
    dates: {prereg: 2026-07-31, closed: 2026-09-10}
    question: {it: "La linea vol batte una baseline **econometrica**. Batte anche la previsione **del mercato**, cioè la varianza implicita nei prezzi delle opzioni?",
               en: "The vol line beats an **econometric** baseline. Does it also beat the **market's** forecast, i.e. the variance implied by option prices?"}
    prior: {it: "Sfavorevole. La regola derivata da questo segnale ha comprato volatilità in 26 casi su 31, mentre il premio di rischio dice il contrario. La varianza implicita incorpora un premio, quindi un buon previsore della varianza non è automaticamente un buon previsore del suo **segno** rispetto all'implicita.",
            en: "Unfavourable. The rule derived from this signal bought volatility in 26 of 31 cases, while the risk premium says the opposite. Implied variance embeds a premium, so a good variance forecaster is not automatically a good forecaster of its **sign** against implied."}
    lever: {it: "nessuna: si giudica un segnale già registrato, non si cambia nulla nel modello",
            en: "none: an already-recorded signal is judged, nothing in the model changes"}
    threshold: {it: "accordo di segno > 0.5 (p < 0.05) **e** correlazione di rango > 0 con intervallo di confidenza che esclude lo zero, **e** un controllo positivo contro la persistenza, n ≥ 40",
                en: "sign agreement > 0.5 (p < 0.05) **and** rank correlation > 0 with a CI excluding zero, **and** a positive control against persistence, n ≥ 40"}
    split: forward
    verdict: NESSUNA CONCLUSIONE
    numbers:
      source: results/vol_paper/edge_information_stage2.json
      keys:
        - {label: {it: "scadenze", en: "expiries"}, path: n}
        - {label: {it: "accordo di segno", en: "sign agreement"}, path: sign_agreement.mean}
        - {label: {it: "correlazione di rango", en: "rank correlation"}, path: spearman.rho}
        - {label: {it: "QLIKE modello (controllo)", en: "model QLIKE (control)"}, path: positive_control.qlike_nn}
        - {label: {it: "QLIKE persistenza (controllo)", en: "naive QLIKE (control)"}, path: positive_control.qlike_naive}
        - {label: {it: "p DM del controllo", en: "control DM p-value"}, path: positive_control.dm.p_value}
    consequence: {it: "Il controllo positivo fallisce **per potenza, non per disegno**: il modello batte la persistenza del 39% in QLIKE, ma a campione effettivo 20 la differenza non è significativa — quindi le due statistiche principali restano **ininterpretabili**. È il caso speculare di B1: lì la baseline perdeva, qui vince senza poterlo dimostrare. Il difetto è nella pre-registrazione, che dimensionò la potenza delle statistiche principali e mai quella del controllo. ⚠ Il segno negativo non autorizza a invertire la regola.",
                  en: "The positive control fails **on power, not on design**: the model beats persistence by 39% in QLIKE, but at an effective sample of 20 the difference is not significant — so the two primary statistics stay **uninterpretable**. It is B1's mirror case: there the baseline lost, here it wins without being able to show it. The defect is in the pre-registration, which sized the power of the primary statistics and never that of the control. ⚠ The negative sign does not license inverting the rule."}
    teoria: "12.3-bis"
    data_state: non-rigenerabile
    data_note: {it: "Previsioni e varianza implicita registrate in avanti: non ricostruibili a posteriori.",
                en: "Forecasts and implied variance recorded forward: not reconstructible afterwards."}

  # ─────────────────────── infrastructure and reproducibility ───────────────────────
  - id: r1-canonical-pair
    name: {it: "R1 — la banda pubblicata è riproducibile da un artefatto?",
           en: "R1 — is the published band reproducible from an artifact?"}
