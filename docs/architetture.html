     <p>Ed è anche il punto in cui il modello smette di avere l'ultima parola: da qui decidono le
     regole operative, che possono benissimo scartare una previsione corretta perché troppo incerta
     o troppo costosa da realizzare.</p>`,
        en:`<p>Only now do the numbers mean something outside the model: they are in the unit of measure
     of the real data, hence comparable with a threshold, with a transaction cost, or with the
     forecast of an alternative method.</p>
     <p>And it is also the point where the model stops having the last word: from here the trading
     rules decide, and they may perfectly well discard a correct forecast because it is too uncertain
     or too expensive to realise.</p>`}},
    {id:"dir", lane:"R", row:3, kind:"ext",
     t:{it:"testa direzionale (compito secondario)",
        en:"directional head (auxiliary task)"},
     s:{it:"su / fermo / giù", en:"up / flat / down"},
     info:{it:`<p>In parallelo la rete può classificare la direzione. Non è il prodotto principale:
     serve soprattutto come <b>compito ausiliario</b>, cioè a costringere la rappresentazione
     interna a essere utile anche per qualcos'altro — un vincolo che spesso aiuta il compito
     vero.</p>
     <p>Pesa una frazione dell'obiettivo di addestramento, e sulla linea della volatilità non è il
     segnale che si usa per decidere.</p>`,
        en:`<p>In parallel the network can classify the direction. It is not the main product: it serves
     mostly as an <b>auxiliary task</b>, i.e. to force the internal representation to be useful for
     something else as well — a constraint that often helps the real task.</p>
     <p>It weighs a fraction of the training objective, and on the volatility line it is not the
     signal used to decide.</p>`}}
  ],
  edges:[["ho","qt","side"],["ho","ts","side"],["qt","rv","side"],["ts","rv","side"],
         ["rv","dn"],["dn","raw"],["dir","dn","side"]],
  steps:["ho","qt","ts","rv","dn","raw"]
}
,
lay_attn:{
  tab:{it:"⑧ dentro: attenzione", en:"⑧ inside: attention"},
  kicker:{it:"cablaggio interno · usato dall'iTransformer",
          en:"internal wiring · used by the iTransformer"},
  title:{it:"Uno strato di attenzione, pezzo per pezzo",
         en:"One attention layer, piece by piece"},
  intro:{it:"Qui si scende di un livello: non più «cosa fa l'architettura», ma come sono collegati i singoli strati dentro un blocco che viene ripetuto più volte.",
         en:"Here we go one level down: no longer \"what the architecture does\", but how the individual layers are wired inside a block that gets repeated several times."},
  nodes:[
    {id:"in", lane:"C", row:0, kind:"tensor",
     t:{it:"token in ingresso", en:"input tokens"},
     s:{it:"({B}, {F}, {D}) — {F} token, ciascuno un vettore di {D} numeri",
        en:"({B}, {F}, {D}) — {F} tokens, each a vector of {D} numbers"},
     info:{it:`<p>Ogni token è una <b>riga</b> di {D} numeri. In questa architettura un token è una
     grandezza (non un istante), e ce ne sono {F}.</p>
     <p>Tutto lo strato lavora su questa matrice e restituisce una matrice della <b>stessa
     forma</b>: è per questo che gli strati si possono impilare uno sopra l'altro senza adattatori.</p>`,
        en:`<p>Every token is a <b>row</b> of {D} numbers. In this architecture a token is a quantity
     (not an instant), and there are {F} of them.</p>
     <p>The whole layer works on this matrix and returns a matrix of the <b>same shape</b>: that is
     why layers can be stacked one on top of another without adapters.</p>`}},
    {id:"n1", lane:"C", row:1, kind:"op",
     t:{it:"normalizzazione (prima, non dopo)", en:"normalisation (before, not after)"},
     s:{it:"media e scala calcolate su ciascun token",
        en:"mean and scale computed on each token"},
     info:{it:`<p>Ogni token viene riportato a media zero e scala uno, indipendentemente dagli altri.</p>
     <p>La posizione conta: qui la normalizzazione sta <b>prima</b> del blocco, non dopo. È una
     scelta che rende l'addestramento molto più stabile quando gli strati sono tanti, perché il
     percorso residuo (la freccia rossa) resta una strada pulita che il gradiente può percorrere
     senza essere schiacciato.</p>`,
        en:`<p>Every token is brought back to zero mean and unit scale, independently of the others.</p>
     <p>The position matters: here normalisation sits <b>before</b> the block, not after. It is a
     choice that makes training far more stable when the layers are many, because the residual path
     (the red arrow) stays a clean road the gradient can travel without being squashed.</p>`}},
    {id:"qkv", lane:"C", row:2, kind:"op",
     t:{it:"una proiezione che produce tre cose",
        en:"one projection that produces three things"},
     s:{it:"Linear {D} → {D3}, poi tagliata in tre: domanda, chiave, valore",
        en:"Linear {D} → {D3}, then split in three: query, key, value"},
     info:{it:`<p>Un unico strato lineare porta ogni token da {D} a {D3} numeri, che vengono poi
     tagliati in tre blocchi da {D}: <b>domanda</b>, <b>chiave</b> e <b>valore</b>.</p>
     <p>L'idea in parole povere: la chiave descrive «cosa offro», la domanda «cosa sto cercando»,
     il valore «cosa passo a chi mi sceglie». Farne una sola matrice invece di tre è solo
     efficienza: il risultato è identico.</p>`,
        en:`<p>A single linear layer takes every token from {D} to {D3} numbers, which are then split
     into three blocks of {D}: <b>query</b>, <b>key</b> and <b>value</b>.</p>
     <p>The idea in plain words: the key describes "what I offer", the query "what I am looking for",
     the value "what I hand over to whoever picks me". Making it one matrix instead of three is pure
     efficiency: the result is identical.</p>`}},
    {id:"heads", lane:"C", row:3, kind:"op",
     t:{it:"divisione in {H} teste", en:"split into {H} heads"},
     s:{it:"ogni testa lavora su {HD} numeri dei {D}",
        en:"each head works on {HD} of the {D} numbers"},
     info:{it:`<p>I {D} numeri vengono divisi fra {H} teste, {HD} ciascuna. Ogni testa fa la sua
     attenzione separatamente, come se guardasse i token da un punto di vista diverso.</p>
     <p>Il senso è che una sola attenzione deve scegliere un solo criterio di somiglianza; averne
     {H} permette di seguire più relazioni contemporaneamente. Alla fine i risultati vengono
     rimessi insieme.</p>`,
        en:`<p>The {D} numbers are split among {H} heads, {HD} each. Every head does its own attention
     separately, as if looking at the tokens from a different point of view.</p>
     <p>The point is that a single attention has to pick a single similarity criterion; having {H} of
     them allows several relations to be followed at once. At the end the results are put back
     together.</p>`}},
    {id:"att", lane:"C", row:4, kind:"gate",
     t:{it:"la matrice di attenzione", en:"the attention matrix"},
     s:{it:"{F} × {F} per ciascuna delle {H} teste",
        en:"{F} × {F} for each of the {H} heads"},
     info:{it:`<p>Per ogni coppia di token si calcola quanto il primo debba ascoltare il secondo:
     nasce una matrice <b>{F} × {F}</b>, una per testa, le cui righe sommano a uno.</p>
     <p>È qui che il costo diventa quadratico: raddoppiando i token il lavoro quadruplica. Ed è
     anche il motivo dell'inversione che dà il nome all'architettura — con {F} grandezze e {T} ore,
     fare l'attenzione fra grandezze costa molto meno che farla fra ore.</p>
     <p>Le righe di questa matrice <b>non sono pesi appresi</b>: si ricalcolano per ogni finestra.
     Sono l'unica parte della rete che cambia struttura a seconda dell'input.</p>`,
        en:`<p>For every pair of tokens it is computed how much the first should listen to the second:
     this gives a <b>{F} × {F}</b> matrix, one per head, whose rows sum to one.</p>
     <p>This is where the cost becomes quadratic: doubling the tokens quadruples the work. And it is
     also the reason for the inversion the architecture is named after — with {F} quantities and {T}
     hours, doing attention across quantities costs far less than doing it across hours.</p>
     <p>The rows of this matrix <b>are not learned weights</b>: they are recomputed for every window.
     They are the only part of the network whose structure changes with the input.</p>`}},
    {id:"outp", lane:"C", row:5, kind:"op",
     t:{it:"si rimettono insieme le teste", en:"the heads are put back together"},
     s:{it:"concatena → Linear {D} → {D}", en:"concatenate → Linear {D} → {D}"},
     info:{it:`<p>Le {H} uscite vengono riaffiancate e passate in un ultimo strato lineare, che le
     mescola. Senza questo passaggio le teste resterebbero canali separati che non si parlano.</p>`,
        en:`<p>The {H} outputs are placed side by side again and passed through a final linear layer
     that mixes them. Without this step the heads would stay separate channels that never talk to
     each other.</p>`}},
    {id:"res1", lane:"C", row:6, kind:"gate",
     t:{it:"prima somma residua", en:"first residual sum"},
     s:{it:"uscita = ingresso + risultato dell'attenzione",
        en:"output = input + result of the attention"},
     info:{it:`<p>Il risultato non sostituisce l'ingresso: gli si <b>somma</b>. Lo strato quindi impara
     una <i>correzione</i>, non una trasformazione completa.</p>
     <p>È forse l'idea più importante delle reti profonde moderne: se lo strato non ha niente di
     utile da dire può produrre quasi zero, e il segnale passa comunque intatto. Senza questa
     scorciatoia, impilare molti strati peggiora invece di migliorare.</p>`,
        en:`<p>The result does not replace the input: it is <b>added</b> to it. The layer therefore
     learns a <i>correction</i>, not a complete transformation.</p>
     <p>It is perhaps the single most important idea in modern deep networks: if the layer has
     nothing useful to say it can output almost zero, and the signal still passes through intact.
     Without this shortcut, stacking many layers makes things worse instead of better.</p>`}},
    {id:"n2", lane:"C", row:7, kind:"op",
     t:{it:"seconda normalizzazione", en:"second normalisation"},
     s:{it:"stessa logica della prima", en:"same logic as the first"},
     info:{it:`<p>Si normalizza di nuovo, prima della seconda metà del blocco.</p>
     <p>Sembra una ripetizione ed è invece necessaria: dopo la somma residua i valori possono essere
     cresciuti parecchio, perché si è aggiunto qualcosa a qualcos'altro. Rinormalizzare rimette la
     rete densa nelle condizioni in cui lavora meglio.</p>`,
        en:`<p>Normalisation happens again, before the second half of the block.</p>
     <p>It looks like a repetition and is instead necessary: after the residual sum the values may
     have grown considerably, because something was added to something else. Renormalising puts the
     dense network back into the conditions in which it works best.</p>`}},
    {id:"ffn", lane:"C", row:8, kind:"op",
     t:{it:"rete densa che allarga e restringe",
        en:"dense network that widens then narrows"},
     s:{it:"Linear {D} → {D4} → GELU → Linear {D4} → {D}",
        en:"Linear {D} → {D4} → GELU → Linear {D4} → {D}"},
     info:{it:`<p>Ogni token, <b>da solo</b>, viene portato a {D4} numeri, passato in una funzione non
     lineare e riportato a {D}. Nessuno scambio fra token: qui ognuno elabora quello che ha
     ricevuto nella fase di attenzione.</p>
     <p>Il ruolo dei due pezzi è complementare: l'attenzione <b>mescola</b> informazione fra token,
     la rete densa la <b>elabora</b> dentro ciascuno. Allargare a quattro volte prima di
     restringere dà spazio a rappresentazioni intermedie che nello spazio stretto non
     starebbero.</p>`,
        en:`<p>Every token, <b>on its own</b>, is taken to {D4} numbers, passed through a non-linear
     function and brought back to {D}. No exchange between tokens: here each one processes what it
     received during the attention phase.</p>
     <p>The roles of the two pieces are complementary: attention <b>mixes</b> information across
     tokens, the dense network <b>processes</b> it inside each of them. Widening fourfold before
     narrowing makes room for intermediate representations that would not fit in the narrow
     space.</p>`}},
    {id:"res2", lane:"C", row:9, kind:"gate",
     t:{it:"seconda somma residua", en:"second residual sum"},
     s:{it:"stessa logica della prima", en:"same logic as the first"},
     info:{it:`<p>Come sopra: si somma, non si sostituisce. Con la profondità, alcuni strati vengono
     anche <b>saltati a caso</b> durante l'addestramento (una forma di regolarizzazione), e la
     somma residua è ciò che rende il salto innocuo.</p>`,
        en:`<p>As above: it adds, it does not replace. With depth, some layers are also <b>skipped at
     random</b> during training (a form of regularisation), and the residual sum is what makes the
     skip harmless.</p>`}},
    {id:"out", lane:"C", row:10, kind:"tensor",
     t:{it:"uscita", en:"output"},
     s:{it:"({B}, {F}, {D}) — identica alla forma d'ingresso",
        en:"({B}, {F}, {D}) — identical to the input shape"},
     info:{it:`<p>Stessa forma dell'ingresso: il blocco è impilabile. L'architettura ne mette in fila
     più copie, ciascuna con i propri pesi.</p>`,
        en:`<p>Same shape as the input: the block is stackable. The architecture lines up several
     copies of it, each with its own weights.</p>`}}
  ],
  edges:[["in","n1"],["n1","qkv"],["qkv","heads"],["heads","att"],["att","outp"],["outp","res1"],
         ["res1","n2"],["n2","ffn"],["ffn","res2"],["res2","out"],
         ["in","res1","re",{it:"il segnale scavalca l'attenzione",
                            en:"the signal bypasses the attention"}],
         ["res1","res2","re",{it:"e scavalca anche la rete densa",
                              en:"and bypasses the dense network too"}]],
  steps:["in","n1","qkv","heads","att","outp","res1","n2","ffn","res2","out"]
},

lay_conv:{
  tab:{it:"⑨ dentro: convoluzione", en:"⑨ inside: convolution"},
  kicker:{it:"cablaggio interno · ramo TCN", en:"internal wiring · TCN branch"},
  title:{it:"Un blocco convoluzionale causale", en:"A causal convolutional block"},
  intro:{it:"La convoluzione guarda una finestra breve di istanti vicini e la fa scorrere. Qui la particolarità sono due: guarda solo indietro, e salta a passi crescenti.",
         en:"A convolution looks at a short window of neighbouring instants and slides it along. Here there are two peculiarities: it looks only backwards, and it skips at growing strides."},
  nodes:[
    {id:"in", lane:"C", row:0, kind:"tensor",
     t:{it:"ingresso", en:"input"}, s:{it:"({B}, {T}, {D})", en:"({B}, {T}, {D})"},
     info:{it:`<p>La sequenza completa: {T} istanti, ciascuno descritto da {D} numeri.</p>
     <p>Nota la differenza rispetto allo strato di attenzione: là i token erano le {F} grandezze,
     qui le posizioni sono <b>gli istanti</b>. Cambia tutto il significato di «vicinanza» — qui due
     posizioni vicine sono due ore consecutive.</p>`,
        en:`<p>The complete sequence: {T} instants, each described by {D} numbers.</p>
     <p>Note the difference from the attention layer: there the tokens were the {F} quantities, here
     the positions are <b>the instants</b>. The whole meaning of "closeness" changes — here two
     nearby positions are two consecutive hours.</p>`}},
    {id:"pad", lane:"C", row:1, kind:"op",
     t:{it:"riempimento solo a sinistra", en:"padding on the left only"},
     s:{it:"{PAD} posizioni aggiunte prima dell'inizio",
        en:"{PAD} positions added before the start"},
     info:{it:`<p>Per fare una convoluzione servono valori anche ai bordi. Se si riempisse da entrambi
     i lati, il calcolo di un istante userebbe valori <b>successivi</b>: sarebbe una fuga di
     informazione dal futuro, invisibile ma letale.</p>
     <p>Riempiendo solo a sinistra si ottiene una convoluzione <b>causale</b>: ogni uscita dipende
     esclusivamente dal proprio passato. È una di quelle scelte che non migliorano la metrica in
     addestramento e sono l'unica cosa che rende il risultato credibile.</p>`,
        en:`<p>To perform a convolution you need values at the edges too. If you padded on both sides,
     the computation for a given instant would use <b>later</b> values: an information leak from the
     future, invisible but lethal.</p>
     <p>Padding on the left only gives a <b>causal</b> convolution: every output depends exclusively
     on its own past. It is one of those choices that do not improve the training metric and are the
     only thing that makes the result credible.</p>`}},
    {id:"conv", lane:"C", row:2, kind:"op",
     t:{it:"convoluzione dilatata", en:"dilated convolution"},
     s:{it:"finestra {KC}, salto {DIL} → copre {PAD}+1 istanti",
        en:"window {KC}, stride {DIL} → covers {PAD}+1 instants"},
     info:{it:`<p>La finestra prende {KC} posizioni, ma <b>distanziate</b> di {DIL}: invece di guardare
     tre istanti consecutivi guarda tre istanti lontani fra loro.</p>
     <p>Impilando blocchi con distanza crescente (1, 2, 4, 8…) si copre una finestra lunghissima
     con pochi strati e pochi pesi. È il trucco che permette a una convoluzione di avere memoria
     lunga senza diventare enorme.</p>
     <p><b>I pesi sono condivisi</b>: la stessa finestra scorre su tutti gli istanti. Il numero di
     parametri non dipende da quanto è lunga la sequenza.</p>`,
        en:`<p>The window takes {KC} positions, but <b>spaced</b> by {DIL}: instead of looking at three
     consecutive instants it looks at three instants far apart from each other.</p>
     <p>Stacking blocks with growing spacing (1, 2, 4, 8…) covers a very long window with few layers
     and few weights. It is the trick that lets a convolution have long memory without becoming
     enormous.</p>
     <p><b>The weights are shared</b>: the same window slides over all instants. The number of
     parameters does not depend on how long the sequence is.</p>`}},
    {id:"na", lane:"C", row:3, kind:"op",
     t:{it:"normalizzazione + non linearità + spegnimento casuale",
        en:"normalisation + non-linearity + random switch-off"},
     s:{it:"LayerNorm → GELU → Dropout", en:"LayerNorm → GELU → Dropout"},
     info:{it:`<p>Tre passaggi standard: si ricentra, si applica una funzione non lineare (senza la
     quale una pila di convoluzioni collasserebbe in una sola), e durante l'addestramento si
     azzera a caso una frazione dei valori per evitare che la rete si appoggi troppo a pochi
     percorsi.</p>`,
        en:`<p>Three standard steps: recentre, apply a non-linear function (without which a stack of
     convolutions would collapse into a single one), and during training zero out a random fraction
     of the values so that the network does not lean too heavily on a few paths.</p>`}},
    {id:"res", lane:"C", row:4, kind:"gate",
     t:{it:"somma residua", en:"residual sum"},
     s:{it:"uscita = ingresso + correzione", en:"output = input + correction"},
     info:{it:`<p>Come nello strato di attenzione: il blocco impara una correzione da sommare, non un
     rimpiazzo. Anche qui il blocco può essere saltato a caso durante l'addestramento.</p>`,
        en:`<p>As in the attention layer: the block learns a correction to add, not a replacement. Here
     too the block can be skipped at random during training.</p>`}},
    {id:"out", lane:"C", row:5, kind:"tensor",
     t:{it:"uscita", en:"output"},
     s:{it:"({B}, {T}, {D}) — forma invariata", en:"({B}, {T}, {D}) — shape unchanged"},
     info:{it:`<p>Stessa forma dell'ingresso: i blocchi si impilano, ciascuno con una distanza di salto
     maggiore del precedente.</p>`,
        en:`<p>Same shape as the input: the blocks stack, each with a larger skip distance than the
     previous one.</p>`}}
  ],
  edges:[["in","pad"],["pad","conv"],["conv","na"],["na","res"],["res","out"],
         ["in","res","re",{it:"scorciatoia", en:"shortcut"}]],
  steps:["in","pad","conv","na","res","out"]
},
lay_ssm:{
  tab:{it:"⑩ dentro: stato", en:"⑩ inside: state"},
  kicker:{it:"cablaggio interno · ramo Mamba", en:"internal wiring · Mamba branch"},
  title:{it:"Un blocco a stato selettivo", en:"A selective state block"},
  intro:{it:"Invece di guardare una finestra, questo blocco porta con sé una memoria e decide istante per istante quanto aggiornarla e quanto dimenticare.",
         en:"Instead of looking at a window, this block carries a memory with it and decides instant by instant how much to update it and how much to forget."},
  nodes:[
    {id:"in", lane:"C", row:0, kind:"tensor",
     t:{it:"ingresso", en:"input"}, s:{it:"({B}, {T}, {D})", en:"({B}, {T}, {D})"},
     info:{it:`<p>La stessa sequenza che vede il ramo convoluzionale: i due rami partono dallo stesso
     ingresso e differiscono solo nel modo di leggerlo.</p>
     <p>Questo blocco lo affronterà senza finestre: lo scorre dall'inizio alla fine portandosi
     dietro una memoria, come farebbe una persona che legge un testo invece di guardarne pezzi
     staccati.</p>`,
        en:`<p>The same sequence the convolutional branch sees: the two branches start from the same
     input and differ only in how they read it.</p>
     <p>This block will tackle it without windows: it scans from beginning to end carrying a memory
     along, the way a person reads a text instead of looking at detached fragments of it.</p>`}},
    {id:"nrm", lane:"C", row:1, kind:"op",
     t:{it:"normalizzazione", en:"normalisation"},
     s:{it:"per istante", en:"per instant"},
     info:{it:`<p>Come negli altri blocchi, la normalizzazione sta all'inizio — prima del calcolo, non
     dopo.</p>
     <p>Nei blocchi con memoria è ancora più importante: se i valori entrassero con scale molto
     diverse, la memoria verrebbe dominata dai pochi istanti più «rumorosi», e il resto della
     sequenza conterebbe poco o nulla.</p>`,
        en:`<p>As in the other blocks, normalisation sits at the start — before the computation, not
     after.</p>
     <p>In blocks with memory it matters even more: if the values came in at wildly different scales,
     the memory would be dominated by the few "noisiest" instants, and the rest of the sequence would
     count for little or nothing.</p>`}},
    {id:"proj", lane:"C", row:2, kind:"op",
     t:{it:"si allarga e si divide in due", en:"it widens and splits in two"},
     s:{it:"Linear {D} → {DIN}×2, poi tagliato: un ramo di lavoro e uno di controllo",
        en:"Linear {D} → {DIN}×2, then split: a working branch and a control branch"},
     info:{it:`<p>Lo spazio viene allargato di {EXP} volte, a {DIN} numeri, e il risultato tagliato in
     due metà. Una metà è il <b>segnale da elaborare</b>, l'altra servirà come <b>controllo</b>
     (più avanti deciderà quanto del risultato lasciar passare).</p>`,
        en:`<p>The space is widened {EXP} times, to {DIN} numbers, and the result split into two
     halves. One half is the <b>signal to process</b>, the other will serve as <b>control</b> (later
     on it decides how much of the result to let through).</p>`}},
    {id:"dw", lane:"C", row:3, kind:"op",
     t:{it:"piccola convoluzione causale + non linearità",
        en:"small causal convolution + non-linearity"},
     s:{it:"finestra 4, un canale alla volta", en:"window 4, one channel at a time"},
     info:{it:`<p>Una convoluzione corta, applicata a ogni canale separatamente. Serve a dare al blocco
     una sensibilità ai vicini immediati, che la ricorrenza da sola coglie meno bene.</p>
     <p>Anche questa è causale: riempimento solo a sinistra.</p>`,
        en:`<p>A short convolution, applied to each channel separately. It gives the block a sensitivity
     to immediate neighbours, which the recurrence alone captures less well.</p>
     <p>This one is causal too: padding on the left only.</p>`}},
    {id:"par", lane:"R", row:3, kind:"ext",
     t:{it:"i parametri della memoria, dipendenti dall'input",
        en:"the memory parameters, input-dependent"},
     s:{it:"passo temporale, ingresso e lettura ({DST} stati)",
        en:"time step, input and readout ({DST} states)"},
     info:{it:`<p>Qui sta la differenza rispetto a una ricorrenza classica. I coefficienti che regolano
     la memoria <b>non sono fissi</b>: vengono calcolati dall'input stesso, istante per istante.</p>
     <p>Il più importante è il <b>passo temporale</b>: se è piccolo la memoria cambia poco (il
     blocco «ignora» quell'istante), se è grande la memoria si aggiorna molto. In pratica la rete
     impara <b>quando vale la pena ricordare</b>, invece di applicare sempre la stessa regola.</p>`,
        en:`<p>Here lies the difference from a classical recurrence. The coefficients governing the
     memory <b>are not fixed</b>: they are computed from the input itself, instant by instant.</p>
     <p>The most important is the <b>time step</b>: if it is small the memory changes little (the
     block "ignores" that instant), if it is large the memory updates a lot. In practice the network
     learns <b>when it is worth remembering</b>, instead of always applying the same rule.</p>`}},
    {id:"scan", lane:"C", row:4, kind:"op",
     t:{it:"ricorrenza: memoria aggiornata istante per istante",
        en:"recurrence: memory updated instant by instant"},
     s:{it:"memoria_t = decadimento · memoria_(t−1) + ingresso_t",
        en:"memory_t = decay · memory_(t−1) + input_t"},
     info:{it:`<p>Il cuore del blocco. La memoria viene trascinata in avanti moltiplicandola per un
     fattore di decadimento e sommandoci il nuovo ingresso. Ripetuto su tutti gli istanti.</p>
     <p>Scritto così sembrerebbe obbligatorio procedere in ordine, un passo alla volta — lentissimo.
     Poiché però il decadimento è una semplice moltiplicazione, la formula si può <b>riscrivere in
     forma chiusa</b> e calcolare a blocchi in parallelo. È il motivo per cui questi modelli sono
     tornati competitivi.</p>`,
        en:`<p>The heart of the block. The memory is dragged forward by multiplying it by a decay factor
     and adding the new input to it. Repeated over all instants.</p>
     <p>Written like this it would seem mandatory to proceed in order, one step at a time — extremely
     slow. But because the decay is a simple multiplication, the formula can be <b>rewritten in
     closed form</b> and computed in parallel blocks. That is why these models became competitive
     again.</p>`}},
    {id:"gate", lane:"C", row:5, kind:"gate",
     t:{it:"controllo e ritorno alla dimensione originale",
        en:"control and return to the original size"},
     s:{it:"lettura della memoria × ramo di controllo → Linear {DIN} → {D}",
        en:"memory readout × control branch → Linear {DIN} → {D}"},
     info:{it:`<p>Si legge la memoria, la si moltiplica per il ramo di controllo messo da parte prima
     (quindi il blocco può <b>zittire</b> la propria uscita quando serve), e si torna alla
     dimensione di partenza.</p>`,
        en:`<p>The memory is read out, multiplied by the control branch set aside earlier (so the block
     can <b>silence</b> its own output when needed), and brought back to the starting size.</p>`}},
    {id:"res", lane:"C", row:6, kind:"gate",
     t:{it:"somma residua", en:"residual sum"},
     s:{it:"uscita = ingresso + correzione", en:"output = input + correction"},
     info:{it:`<p>Come in tutti gli altri blocchi: si somma, non si sostituisce.</p>
     <p>Qui la scorciatoia ha un ruolo aggiuntivo. Una ricorrenza moltiplica ripetutamente per un
     fattore di decadimento, e questo tende a far svanire il segnale di addestramento sui passi più
     lontani; il collegamento residuo offre una strada che quelle moltiplicazioni non le
     attraversa.</p>`,
        en:`<p>As in every other block: it adds, it does not replace.</p>
     <p>Here the shortcut plays an extra role. A recurrence multiplies repeatedly by a decay factor,
     and this tends to make the training signal vanish on the most distant steps; the residual
     connection offers a road that does not cross those multiplications.</p>`}},
    {id:"out", lane:"C", row:7, kind:"tensor",
     t:{it:"uscita", en:"output"}, s:{it:"({B}, {T}, {D})", en:"({B}, {T}, {D})"},
     info:{it:`<p>Forma invariata, blocchi impilabili: l'architettura ne mette in fila alcuni, e solo
     alla fine tiene <b>l'ultimo istante</b>, dove la memoria ha già assorbito tutta la
     sequenza.</p>
     <p>È la differenza pratica col ramo convoluzionale, che invece media su tutti gli istanti: due
     riassunti diversi della stessa storia, ed è per questo che vale la pena tenerli entrambi.</p>`,
        en:`<p>Shape unchanged, blocks stackable: the architecture lines up a few of them, and only at
     the end keeps <b>the last instant</b>, where the memory has already absorbed the whole
     sequence.</p>
     <p>This is the practical difference from the convolutional branch, which instead averages over
     all instants: two different summaries of the same history, and that is why it is worth keeping
     both.</p>`}}
  ],
  edges:[["in","nrm"],["nrm","proj"],["proj","dw"],["dw","scan"],["par","scan","side"],
         ["scan","gate"],["gate","res"],["res","out"],
         ["proj","gate","re",{it:"il ramo di controllo aspetta qui",
                              en:"the control branch waits here"}],
         ["in","res","re",{it:"scorciatoia", en:"shortcut"}]],
  steps:["in","nrm","proj","dw","par","scan","gate","res","out"]
},

lay_dec:{
  tab:{it:"⑪ dentro: decomposizione", en:"⑪ inside: decomposition"},
  kicker:{it:"cablaggio interno · blocco N-HiTS", en:"internal wiring · N-HiTS block"},
  title:{it:"Un blocco che spiega una scala e la toglie di mezzo",
         en:"A block that explains one scale and removes it from the way"},
  intro:{it:"Il blocco più semplice dei quattro come componenti, e il più particolare come idea: produce due uscite, una da sottrarre all'ingresso e una da sommare al risultato.",
         en:"The simplest of the four in terms of components, and the most peculiar as an idea: it produces two outputs, one to subtract from the input and one to add to the result."},
  nodes:[
    {id:"in", lane:"C", row:0, kind:"tensor",
     t:{it:"residuo in ingresso", en:"incoming residual"},
     s:{it:"({B}, {T}, {D})", en:"({B}, {T}, {D})"},
     info:{it:`<p>Non è il segnale originale: è <b>quello che i blocchi precedenti non hanno ancora
     spiegato</b>.</p>
     <p>Per il primo blocco coincidono, perché nessuno ha ancora tolto niente. Dal secondo in poi
     no: ogni blocco vede un mondo già ripulito dai suoi predecessori, e questo lo costringe a
     occuparsi di qualcosa di diverso — è la forma di specializzazione più esplicita fra tutte
     quelle viste in questa pagina.</p>`,
        en:`<p>It is not the original signal: it is <b>what the previous blocks have not explained
     yet</b>.</p>
     <p>For the first block the two coincide, because nobody has removed anything yet. From the
     second one on they do not: each block sees a world already cleaned up by its predecessors, and
     this forces it to deal with something different — it is the most explicit form of specialisation
     among all those seen on this page.</p>`}},
    {id:"pool", lane:"C", row:1, kind:"op",
     t:{it:"riduzione della risoluzione", en:"resolution reduction"},
     s:{it:"finestra {POOL} → {TP} passi invece di {T}",
        en:"window {POOL} → {TP} steps instead of {T}"},
     info:{it:`<p>Si media (oppure si prende il massimo) a gruppi di {POOL} istanti: la sequenza si
     accorcia da {T} a {TP}.</p>
     <p>È questa scelta che assegna una <b>scala</b> al blocco. Con finestre grandi restano solo le
     forme lente; con finestra uno si vede tutto il dettaglio. Mettendo in fila blocchi con
     finestre decrescenti, la rete descrive prima il quadro generale e poi i particolari.</p>`,
        en:`<p>Averaging (or taking the maximum) over groups of {POOL} instants: the sequence shortens
     from {T} to {TP}.</p>
     <p>It is this choice that assigns a <b>scale</b> to the block. With large windows only the slow
     shapes remain; with a window of one you see all the detail. By lining up blocks with decreasing
     windows, the network describes the broad picture first and the particulars afterwards.</p>`}},
    {id:"mlp", lane:"C", row:2, kind:"op",
     t:{it:"appiattimento + rete densa", en:"flattening + dense network"},
     s:{it:"{FLAT} numeri in ingresso alla rete",
        en:"{FLAT} numbers entering the network"},
     info:{it:`<p>La sequenza ridotta viene stesa in un unico vettore lungo e data a una piccola rete
     densa.</p>
     <p>⚠ Attenzione a una conseguenza: la lunghezza di questo vettore dipende da {T} e da {D},
     quindi il numero di pesi cresce con la finestra. È la ragione per cui questa architettura è
     sensibile alla lunghezza della storia molto più delle altre due — e si vede facendo crescere
     T nei parametri qui sotto.</p>`,
        en:`<p>The reduced sequence is laid out into a single long vector and handed to a small dense
     network.</p>
     <p>⚠ Beware of one consequence: the length of this vector depends on {T} and on {D}, so the
     number of weights grows with the window. That is why this architecture is far more sensitive to
     the length of the history than the other two — and you can see it by increasing T in the
     parameters below.</p>`}},
    {id:"back", lane:"L", row:3, kind:"op",
     t:{it:"testa di ricostruzione", en:"reconstruction head"},
     s:{it:"→ {BC} numeri, rimodellati come l'ingresso",
        en:"→ {BC} numbers, reshaped like the input"},
     info:{it:`<p>Ricostruisce la parte di segnale che il blocco dichiara di aver spiegato, nella stessa
     forma dell'ingresso, così da poterla <b>sottrarre</b>.</p>
     <p>È un'affermazione forte: il blocco non dice solo «ecco il mio contributo», dice anche
     «questa parte l'ho presa io, non guardatela più».</p>`,
        en:`<p>It reconstructs the part of the signal the block claims to have explained, in the same
     shape as the input, so that it can be <b>subtracted</b>.</p>
     <p>It is a strong claim: the block does not just say "here is my contribution", it also says
     "this part is mine, stop looking at it".</p>`}},
    {id:"fore", lane:"R", row:3, kind:"op",
     t:{it:"testa di contributo", en:"contribution head"},
     s:{it:"→ {D} numeri", en:"→ {D} numbers"},
     info:{it:`<p>Il contributo alla previsione finale, che si somma a quello degli altri blocchi.</p>
     <p>Le due teste condividono la stessa rete densa a monte, ma hanno pesi separati: il blocco può
     quindi dire «questa parte di segnale l'ho spiegata» e «ecco cosa ne deduco per il futuro» in
     due modi diversi, invece di essere costretto a una sola risposta.</p>`,
        en:`<p>The contribution to the final prediction, which adds to that of the other blocks.</p>
     <p>The two heads share the same upstream dense network, but have separate weights: the block can
     therefore say "I have explained this part of the signal" and "here is what I infer from it about
     the future" in two different ways, instead of being forced into a single answer.</p>`}},
    {id:"sub", lane:"C", row:4, kind:"gate",
     t:{it:"il residuo si assottiglia", en:"the residual gets thinner"},
     s:{it:"residuo ← residuo − ricostruzione",
        en:"residual ← residual − reconstruction"},
     info:{it:`<p>Il blocco successivo riceverà un ingresso <b>diverso</b>: solo ciò che resta. È il
     rientro più esplicito di tutta la pagina — l'uscita di un blocco modifica l'ingresso del
     prossimo.</p>
     <p>Se un blocco sbaglia e sottrae qualcosa di utile, quell'informazione è persa per tutti
     quelli dopo. È il prezzo dell'eleganza di questo schema.</p>`,
        en:`<p>The next block will receive a <b>different</b> input: only what is left. It is the most
     explicit feedback path on the whole page — one block's output modifies the next one's input.</p>
     <p>If a block gets it wrong and subtracts something useful, that information is lost for
     everyone downstream. It is the price of this scheme's elegance.</p>`}}
  ],
  edges:[["in","pool"],["pool","mlp"],["mlp","back","side"],["mlp","fore","side"],
         ["back","sub","side"],["sub","in","re",{it:"torna indietro come nuovo residuo",
                                                 en:"goes back as the new residual"}]],
  steps:["in","pool","mlp","back","fore","sub"]
},

units:{
  tab:{it:"⑫ nodi e connessioni", en:"⑫ units and connections"},
  kicker:{it:"il livello più basso", en:"the lowest level"},
  title:{it:"Cosa sono davvero «i nodi» e «le connessioni»",
         en:"What \"units\" and \"connections\" really are"},
  intro:{it:"Le quattro forme di collegamento che compongono tutto il resto. Clicca un riquadro per la spiegazione; il numero di nodi disegnati si regola col parametro in fondo.",
         en:"The four forms of connection everything else is made of. Click a cell for the explanation; the number of units drawn is set by the parameter at the bottom."},
  custom:"units",
  nodes:[
    {id:"dense", cell:0,
     t:{it:"strato denso — tutti con tutti", en:"dense layer — everyone with everyone"},
     info:{it:`<p>Ogni nodo del livello successivo è collegato a <b>tutti</b> quelli del precedente:
     ogni collegamento ha il suo peso, e il nodo somma quello che riceve, aggiunge un termine
     fisso e passa il risultato in una funzione non lineare.</p>
     <p>Il numero di pesi è il <b>prodotto</b> dei due livelli: da {D} a {D4} numeri significa
     {D}×{D4} collegamenti, ed è il motivo per cui la rete densa dello strato di attenzione contiene
     gran parte dei parametri del modello.</p>
     <p>Un nodo non ha un significato assegnato da nessuno: quello che rappresenta emerge
     dall'addestramento, ed è il motivo per cui non si può «leggere» una rete guardando i suoi
     nodi uno per uno.</p>`,
        en:`<p>Every unit of the next level is connected to <b>all</b> of those in the previous one:
     each connection has its own weight, and the unit sums what it receives, adds a fixed term and
     passes the result through a non-linear function.</p>
     <p>The number of weights is the <b>product</b> of the two levels: from {D} to {D4} numbers means
     {D}×{D4} connections, and that is why the dense network of the attention layer holds most of the
     model's parameters.</p>
     <p>A unit has no meaning assigned to it by anyone: what it represents emerges from training, and
     that is why you cannot "read" a network by looking at its units one by one.</p>`}},
    {id:"conv", cell:1,
     t:{it:"convoluzione — pochi collegamenti, ripetuti",
        en:"convolution — few connections, repeated"},
     info:{it:`<p>Ogni nodo di uscita guarda solo una <b>finestra breve</b> di nodi vicini, e — questa
     è la parte importante — la stessa manciata di pesi viene <b>riusata</b> per tutte le
     posizioni, come uno stampino che scorre.</p>
     <p>Due conseguenze. Il numero di pesi non dipende dalla lunghezza della sequenza. E la rete
     assume che <i>ciò che conta abbia la stessa forma ovunque</i>: se un motivo è utile alle tre
     di notte, lo è anche a mezzogiorno.</p>
     <p>Nella versione <b>causale</b> la finestra è tagliata a metà: guarda solo indietro.</p>`,
        en:`<p>Every output unit looks only at a <b>short window</b> of neighbouring units, and — this
     is the important part — the same handful of weights is <b>reused</b> for every position, like a
     stencil sliding along.</p>
     <p>Two consequences. The number of weights does not depend on the length of the sequence. And
     the network assumes that <i>what matters has the same shape everywhere</i>: if a pattern is
     useful at three in the morning, it is useful at noon too.</p>
     <p>In the <b>causal</b> version the window is cut in half: it looks only backwards.</p>`}},
    {id:"attn", cell:2,
     t:{it:"attenzione — collegamenti decisi sul momento",
        en:"attention — connections decided on the spot"},
     info:{it:`<p>Anche qui ogni nodo è collegato a tutti gli altri, ma la forza dei collegamenti
     <b>non è un peso appreso</b>: si ricalcola per ogni finestra, confrontando i token fra loro.</p>
     <p>È la differenza che conta: uno strato denso applica sempre la stessa regola, l'attenzione
     decide di volta in volta chi ascoltare. Ciò che si impara non è «quanto conta il token 7», ma
     «come si decide quanto conta un token, viste le circostanze».</p>
     <p>Il prezzo è il costo quadratico: con {F} token servono {F}×{F} confronti, per ciascuna
     delle {H} teste.</p>`,
        en:`<p>Here too every unit is connected to all the others, but the strength of the connections
     <b>is not a learned weight</b>: it is recomputed for every window, by comparing the tokens with
     one another.</p>
     <p>That is the difference that matters: a dense layer always applies the same rule, attention
     decides case by case whom to listen to. What is learned is not "how much token 7 counts", but
     "how one decides how much a token counts, given the circumstances".</p>
     <p>The price is the quadratic cost: with {F} tokens you need {F}×{F} comparisons, for each of
     the {H} heads.</p>`}},
    {id:"res", cell:3,
     t:{it:"collegamento residuo — la scorciatoia",
        en:"residual connection — the shortcut"},
     info:{it:`<p>Un collegamento che <b>salta</b> uno o più strati e somma l'ingresso all'uscita.
     Nessun peso, nessun calcolo: solo una somma.</p>
     <p>Serve a due cose. In avanti, permette allo strato di imparare una piccola correzione invece
     di dover ricostruire tutto da capo. All'indietro, dà al segnale di addestramento una strada
     diretta per tornare agli strati iniziali senza attraversare decine di moltiplicazioni che lo
     rimpicciolirebbero fino a farlo sparire.</p>
     <p>È la ragione tecnica per cui oggi si possono addestrare reti profonde: senza queste
     scorciatoie, aggiungere strati a un certo punto peggiorava i risultati.</p>`,
        en:`<p>A connection that <b>skips</b> one or more layers and adds the input to the output. No
     weights, no computation: just a sum.</p>
     <p>It serves two purposes. Forwards, it lets the layer learn a small correction instead of
     having to rebuild everything from scratch. Backwards, it gives the training signal a direct road
     back to the early layers without crossing dozens of multiplications that would shrink it until
     it disappeared.</p>
     <p>It is the technical reason why deep networks can be trained today: without these shortcuts,
     adding layers past a certain point made results worse.</p>`}}
  ],
  edges:[],
  steps:["dense","conv","attn","res"]
}

};

const LANE = {L:{x:26,w:280}, C:{x:352,w:360}, R:{x:758,w:280}};
const ROW_H = 124, TOP = 30, W = 1064;
const wrapText = (s, max) => {
  const words = String(s).split(' '); const out = []; let cur = '';
  for (const w of words){
    if (cur && (cur + ' ' + w).length > max){ out.push(cur); cur = w; }
    else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) out.push(cur);
  return out;
};
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const FILL = {tensor:['var(--tens)','var(--tensb)'], op:['var(--node)','var(--nodeb)'],
              gate:['var(--gate)','var(--gateb)'], ext:['var(--ext)','var(--extb)']};

/* IT: didascalie dei quattro riquadri di ⑫: dipendono dal numero di nodi disegnati,
       quindi sono funzioni e non stringhe.
   EN: captions of the four cells of ⑫: they depend on the number of units drawn,
       hence they are functions and not strings. */
const CAP = {
  dense:{it:(n,m)=>`${n}×${m} = ${n*m} pesi, uno per collegamento`,
         en:(n,m)=>`${n}×${m} = ${n*m} weights, one per connection`},
  conv:{it:()=>`3 soli pesi (i tre colori) riusati a ogni posizione`,
        en:()=>`only 3 weights (the three colours) reused at every position`},
  attn:{it:n=>`${n}×${n-1} collegamenti, ricalcolati a ogni finestra`,
        en:n=>`${n}×${n-1} connections, recomputed for every window`},
  res:{it:()=>`nessun peso: l'ingresso viene sommato all'uscita`,
       en:()=>`no weights: the input is added to the output`}
};

let view = 'pipeline', sel = null, stepIdx = -1, timer = null, reOnly = false;

function geom(v){
  const g = {}; let maxRow = 0;
  for (const n of v.nodes){
    const lane = LANE[n.lane] || LANE.C;
    const titleLines = wrapText(S(L(n.t)), n.lane === 'C' ? 40 : 30);
    const shapeLines = n.s ? wrapText(S(L(n.s)), n.lane === 'C' ? 52 : 40) : [];
    const h = 22 + titleLines.length * 17 + shapeLines.length * 14;
    g[n.id] = {x:lane.x, w:lane.w, y:TOP + n.row * ROW_H, h, titleLines, shapeLines};
    maxRow = Math.max(maxRow, n.row);
  }
  return {g, H: TOP + maxRow * ROW_H + 110};
}
function edgePath(a, b){
  const ax = a.x + a.w/2, bx = b.x + b.w/2, ay = a.y + a.h, by = b.y;
  if (Math.abs(ax - bx) < 2) return `M${ax} ${ay} L${bx} ${by - 9}`;
  return `M${ax} ${ay} C${ax} ${ay + 40}, ${bx} ${by - 46}, ${bx} ${by - 9}`;
}
function rePath(a, b){
  const ay = a.y + a.h/2, by = b.y + b.h/2;
  const out = Math.min(a.x, b.x) - 20;
  return `M${a.x} ${ay} C${out} ${ay}, ${out} ${by}, ${b.x - 9} ${by}`;
}

function renderUnits(v){
  // IT: disegno letterale di nodi e collegamenti, in quattro riquadri.
  // EN: literal drawing of units and connections, in four cells.
  const CW = 512, CH = 300, GAP = 22, n = Math.max(3, Math.min(12, P.UNITS));
  let s = `<svg viewBox="0 0 ${CW*2+GAP} ${CH*2+GAP}" role="img" aria-label="${esc(L(v.title))}">`;
  const cells = [[0,0],[1,0],[0,1],[1,1]];
  v.nodes.forEach((nd, i) => {
    const [cx, cy] = cells[nd.cell];
    const ox = cx*(CW+GAP), oy = cy*(CH+GAP);
    const selected = sel === nd.id;
    s += `<g class="nd${selected?' sel':''}" data-id="${nd.id}">`;
    s += `<rect x="${ox+1}" y="${oy+1}" width="${CW-2}" height="${CH-2}" rx="10"
           fill="var(--panel2)" stroke="${selected?'var(--sel)':'var(--line)'}" stroke-width="${selected?3:1.4}"/>`;
    s += `<text x="${ox+CW/2}" y="${oy+30}" text-anchor="middle">${esc(S(L(nd.t)))}</text>`;
    const cap = t => `<text class="sh" x="${ox+CW/2}" y="${oy+CH-16}" text-anchor="middle">${esc(t)}</text>`;
    const yTop = oy+70, yBot = oy+CH-40, xL = ox+90, xR = ox+CW-90;
    const pos = (k, tot, x, y) => [x, y + (tot<2?0:k*( (yBot-yTop) / (tot-1) ))];
    const dot = (x,y,f) => `<circle cx="${x}" cy="${y}" r="9" fill="${f||'var(--node)'}" stroke="var(--nodeb)" stroke-width="1.5"/>`;
    const line = (a,b,st,w) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${st}" stroke-width="${w||1}" opacity=".75"/>`;
    if (nd.id === 'dense'){
      const m = Math.max(2, n-2);
      for (let i2=0;i2<n;i2++) for (let j=0;j<m;j++)
        s += line(pos(i2,n,xL,yTop), pos(j,m,xR,yTop), 'var(--nodeb)', .7);
      for (let i2=0;i2<n;i2++) s += dot(...pos(i2,n,xL,yTop));
      for (let j=0;j<m;j++) s += dot(...pos(j,m,xR,yTop), 'var(--tens)');
      s += cap(CAP.dense[LANG](n, m));
    } else if (nd.id === 'conv'){
      const cols = ['var(--acc)','var(--extb)','var(--gateb)'];
      for (let j=0;j<n-2;j++) for (let k=0;k<3;k++)
        s += line(pos(j+k,n,xL,yTop), pos(j,n-2,xR,yTop), cols[k], 1.5);
      for (let i2=0;i2<n;i2++) s += dot(...pos(i2,n,xL,yTop));
      for (let j=0;j<n-2;j++) s += dot(...pos(j,n-2,xR,yTop), 'var(--tens)');
      s += cap(CAP.conv[LANG]());
    } else if (nd.id === 'attn'){
      const yc = oy + CH/2 - 10, x0 = ox+70, dx = (CW-140)/(n-1);
      for (let i2=0;i2<n;i2++) for (let j=0;j<n;j++) if (i2!==j){
        const a=[x0+i2*dx,yc], b=[x0+j*dx,yc], h=26+Math.abs(i2-j)*9;
        s += `<path d="M${a[0]} ${a[1]} Q${(a[0]+b[0])/2} ${yc-h} ${b[0]} ${b[1]}" fill="none"
               stroke="var(--acc)" stroke-width="${(0.4+1.6/(1+Math.abs(i2-j)))}" opacity=".5"/>`;
      }
      for (let i2=0;i2<n;i2++) s += dot(x0+i2*dx, yc, 'var(--tens)');
      s += cap(CAP.attn[LANG](n));
    } else {
      const yc = oy + CH/2 + 10, x0 = ox+80, dx = (CW-160)/3;
      for (let i2=0;i2<3;i2++)
        s += `<line x1="${x0+i2*dx+10}" y1="${yc}" x2="${x0+(i2+1)*dx-10}" y2="${yc}" stroke="var(--nodeb)" stroke-width="1.8"/>`;
      for (let i2=0;i2<4;i2++) s += dot(x0+i2*dx, yc, i2===0||i2===3?'var(--tens)':'var(--node)');
      s += `<path d="M${x0} ${yc-12} C${x0+dx} ${yc-90}, ${x0+2*dx} ${yc-90}, ${x0+3*dx} ${yc-12}"
             fill="none" stroke="var(--re)" stroke-width="2" stroke-dasharray="6 4"/>`;
      s += cap(CAP.res[LANG]());
    }
    s += `</g>`;
  });
  document.getElementById('svgbox').innerHTML = s + '</svg>';
  document.querySelectorAll('.nd').forEach(el => el.addEventListener('click', () => select(el.dataset.id)));
}

function render(){
  const v = VIEWS[view];
  if (v.custom === 'units') return renderUnits(v);
  const {g, H} = geom(v);
  let s = `<svg viewBox="-30 0 ${W + 30} ${H}" role="img" aria-label="${esc(L(v.title))}"><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--nodeb)"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--extb)"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--re)"/></marker></defs>`;

  for (const [from, to, kind, label] of v.edges){
    const a = g[from], b = g[to];
    if (!a || !b) continue;
    const isRe = kind === 're';
    const dim = (reOnly && !isRe) ? ' dim' : '';
    const stroke = isRe ? 'var(--re)' : (kind === 'side' ? 'var(--extb)' : 'var(--nodeb)');
    const dash = isRe ? '6 4' : (kind === 'side' ? '5 4' : 'none');
    const mk = isRe ? 'ar' : (kind === 'side' ? 'as' : 'a');
    s += `<path class="edge${dim}" d="${isRe ? rePath(a,b) : edgePath(a,b)}" fill="none"
           stroke="${stroke}" stroke-width="1.8" stroke-dasharray="${dash}" marker-end="url(#${mk})"/>`;
    if (label){
      const lx = Math.min(a.x, b.x) - 28;
      const ly = (a.y + a.h/2 + b.y + b.h/2) / 2;
      s += `<text class="edge${dim} eg" x="${lx}" y="${ly}" text-anchor="middle"
             transform="rotate(-90 ${lx} ${ly})">${esc(L(label))}</text>`;
    }
  }
  for (const n of v.nodes){
    const q = g[n.id];
    const [fill, stroke] = FILL[n.kind];
    const dash = n.kind === 'ext' ? ' stroke-dasharray="5 4"' : '';
    const cls = 'nd' + (sel === n.id ? ' sel' : '') + (reOnly ? ' dim' : '');
    s += `<g class="${cls}" data-id="${n.id}"><rect x="${q.x}" y="${q.y}" width="${q.w}"
           height="${q.h}" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="1.6"${dash}/>`;
    let ty = q.y + 25;
    for (const l of q.titleLines){ s += `<text x="${q.x + q.w/2}" y="${ty}" text-anchor="middle">${esc(l)}</text>`; ty += 17; }
    for (const l of q.shapeLines){ s += `<text class="sh" x="${q.x + q.w/2}" y="${ty}" text-anchor="middle">${esc(l)}</text>`; ty += 14; }
    s += `</g>`;
  }
  document.getElementById('svgbox').innerHTML = s + `</svg>`;
  document.querySelectorAll('.nd').forEach(el =>
    el.addEventListener('click', () => select(el.dataset.id)));
}

function select(id){
  const v = VIEWS[view];
  const n = v.nodes.find(x => x.id === id);
  if (!n) return;
  sel = id;
  const i = v.steps.indexOf(id);
  if (i >= 0) stepIdx = i;
  document.getElementById('pbadge').textContent = n.kind ? L(UI.badge[n.kind]) : '';
  document.getElementById('ptitle').textContent = S(L(n.t));
  document.getElementById('pshape').textContent = n.s ? S(L(n.s)) : '';
  document.getElementById('ptext').innerHTML = S(L(n.info));
  document.getElementById('stepinfo').textContent =
    i >= 0 ? UI.step[LANG](i + 1, v.steps.length) : L(UI.offPath);
  document.getElementById('panel').scrollTop = 0;
  render();
}
function setView(k){
  view = k; sel = null; stepIdx = -1; stop();
  const v = VIEWS[k];
  document.getElementById('vkick').textContent = L(v.kicker);
  document.getElementById('vtitle').textContent = L(v.title);
  document.getElementById('vintro').textContent = L(v.intro);
  document.getElementById('stepinfo').textContent = '';
  document.querySelectorAll('#tabs .btn').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  render();
}
function step(d){
  const v = VIEWS[view];
  stepIdx = (stepIdx + d + v.steps.length) % v.steps.length;
  select(v.steps[stepIdx]);
}
function stop(){
  if (timer){ clearInterval(timer); timer = null; document.getElementById('play').textContent = L(UI.play); }
}

/* IT: la cornice statica non ha piu' testo nel markup: si popola da UI, cosi' la stessa
       funzione serve al primo caricamento e al cambio di lingua.
   EN: the static chrome carries no copy in the markup: it is populated from UI, so the same
       function serves both the first load and the language switch. */
function applyStatic(){
  document.documentElement.lang = L(UI.htmlLang);
  const set = (id, k) => document.getElementById(id).textContent = L(UI[k]);
  set('h1','h1'); set('theme','theme'); set('lang','langBtn');
  set('prev','prev'); set('next','next'); set('reflow','reflow'); set('reset','reset');
  ['lg1','lg2','lg3','lg4','lg5','lb1','lb2','lb3','lb4','lb5','lb6','lb7']
    .forEach(id => set(id, id));
  document.getElementById('play').textContent = timer ? L(UI.pause) : L(UI.play);
  document.getElementById('sub').innerHTML = L(UI.sub);
  document.getElementById('foot').innerHTML = L(UI.foot);
  document.getElementById('tabs').innerHTML = Object.entries(VIEWS)
    .map(([k, v]) => `<button class="btn${k === view ? ' on' : ''}" data-k="${k}">${esc(L(v.tab))}</button>`)
    .join('');
  document.querySelectorAll('#tabs .btn').forEach(b =>
    b.addEventListener('click', () => setView(b.dataset.k)));
}
function showHelp(){
  document.getElementById('pbadge').textContent = L(UI.helpBadge);
  document.getElementById('ptitle').textContent = L(UI.helpTitle);
  document.getElementById('pshape').textContent = '';
  document.getElementById('ptext').innerHTML = L(UI.helpText);
}

document.getElementById('next').addEventListener('click', () => { stop(); step(1); });
document.getElementById('prev').addEventListener('click', () => { stop(); step(-1); });
document.getElementById('play').addEventListener('click', () => {
  if (timer) return stop();
  document.getElementById('play').textContent = L(UI.pause);
  step(1);
  timer = setInterval(() => {
    if (stepIdx >= VIEWS[view].steps.length - 1) return stop();
    step(1);
  }, 4500);
});
document.getElementById('reflow').addEventListener('click', () => { reOnly = !reOnly; render(); });
document.getElementById('reset').addEventListener('click', () => { reOnly = false; sel = null; stop(); render(); });
document.getElementById('theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
});
/* IT: il cambio di lingua non azzera lo stato: vista, blocco selezionato e modalita' rientri
       restano dove sono, cambia solo il testo.
   EN: switching language does not reset state: view, selected block and feedback-only mode
       stay where they are, only the copy changes. */
document.getElementById('lang').addEventListener('click', () => {
  LANG = LANG === 'it' ? 'en' : 'it';
  applyStatic();
  const v = VIEWS[view];
  document.getElementById('vkick').textContent = L(v.kicker);
  document.getElementById('vtitle').textContent = L(v.title);
  document.getElementById('vintro').textContent = L(v.intro);
  if (sel) select(sel); else { showHelp(); render(); }
});
[['pB','B'],['pT','T'],['pF','F'],['pD','D'],['pP','PATCH'],['pE','E'],['pH','H']].forEach(([id, key]) => {
  document.getElementById(id).addEventListener('input', e => {
    const val = parseInt(e.target.value, 10);
    if (!isNaN(val) && val > 0){ P[key] = val; if (sel) select(sel); else render(); }
  });
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight'){ stop(); step(1); }
  if (e.key === 'ArrowLeft'){ stop(); step(-1); }
});
applyStatic();
showHelp();
setView('pipeline');
</script>
</body>
</html>
