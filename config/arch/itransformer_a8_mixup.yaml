# IT: A8 — quick-win mixup: override d'ESEMPIO, MAI addestrato. Unico diff
#     funzionale vs itransformer.yaml = training.mixup_alpha 0.0→0.2 (+ output
#     dir isolate). Attivazione: $env:QUANTSYS_ARCH="itransformer_a8_mixup"
#     + sandbox QUANTSYS_MODELS_ROOT=models_a8_mixup (models/itransformer
#     production READ-ONLY). mixup_alpha NON va mai attivato in default.yaml
#     né in arch/itransformer.yaml pre-gate: assente/0.0 = path bit-identico.
#     Gate QLIKE pre-registrato in STATUS.md il 2026-07-15 (run nella finestra
#     GPU post-gate-v1). ⚠ La metà drop_path di A8 è OBSOLETA: l'incumbent è
#     già a drop_path_rate 0.2 dal tuning pre-registrato 2026-06-10.
# EN: A8 — mixup quick-win: EXAMPLE override, NEVER trained. Only functional
#     diff vs itransformer.yaml = training.mixup_alpha 0.0→0.2 (+ isolated
#     output dirs). Activate via QUANTSYS_ARCH="itransformer_a8_mixup"
#     + QUANTSYS_MODELS_ROOT=models_a8_mixup sandbox (production
#     models/itransformer READ-ONLY). mixup_alpha must never be enabled in
#     default.yaml nor arch/itransformer.yaml pre-gate: absent/0.0 =
#     bit-identical path. QLIKE gate pre-registered in STATUS.md on 2026-07-15
#     (run in the post-gate-v1 GPU window). ⚠ The drop_path half of A8 is
#     OBSOLETE: the incumbent already uses drop_path_rate 0.2 (2026-06-10 tuning).

# IT: Modello — IDENTICO a itransformer.yaml (tuning pre-registrato 2026-06-10).
# EN: Model — IDENTICAL to itransformer.yaml (pre-registered 2026-06-10 tuning).
model:
  architecture: "itransformer"
  tft_d_model: 128
  tft_n_heads: 4
  tft_n_layers: 3
  tft_dropout: 0.3
  patch_size: 5
  drop_path_rate: 0.2

# IT: Training — iperparametri ereditati dal tuning 1h; UNICO lever: mixup_alpha.
#     Mixup temporale (lam biasato verso l'originale, già cablato in 02_train):
#     su target log-RV il mix dei target = media geometrica delle RV (coerente).
# EN: Training — hyper-params inherited from the 1h tuning; ONLY lever: mixup_alpha.
#     Temporal mixup (lam biased toward the original, already wired in 02_train):
#     on the log-RV target the target mix = geometric mean of RVs (coherent).
training:
  learning_rate: 3.0e-5
  weight_decay: 3.0e-03
  grad_clip_norm: 0.5
  mixup_alpha: 0.2
  # IT: output isolato — MAI models/itransformer (checkpoint production).
  # EN: isolated output — NEVER models/itransformer (production checkpoints).
  output_dir: "./models/itransformer_a8_mixup"

backtest:
  # IT: NO backtest trading sui modelli vol (regola VOL-S); dir tenuta per coerenza.
  # EN: NO trading backtest on vol models (VOL-S rule); dir kept for consistency.
  output_dir: "./results/itransformer_a8_mixup"
