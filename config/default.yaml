# IT: Risorse hardware — device, worker DataLoader, ottimizzazioni cuDNN.
# EN: Hardware resources — device, DataLoader workers, cuDNN optimizations.
hardware:
  device: cuda
  cpu_fraction: 0.5
  num_workers: 6
  pin_memory: true
  cudnn_benchmark: true

# IT: Sorgente dati BTC/USDT da Binance e cache locale parquet.
# EN: BTC/USDT data source from Binance and local parquet cache.
data:
  symbol: BTCUSDT
  # IT: PIVOT 1h (2026-06-09): cost/σ a 1m = 1.9-3.3× → a 1h ~0.25-0.42× (barre ∝ √Δt,
  #     costo fisso). Rollback 1m: interval=1m, start_time='2025-05-19' + restore
  #     data/backup_1m/raw_candles.parquet. Tutte le finestre temporali nel codice
  #     derivano da questo campo via interval_minutes (identità a 1m).
  # EN: 1h PIVOT (2026-06-09): cost/σ at 1m = 1.9-3.3× → at 1h ~0.25-0.42× (bar moves ∝ √Δt,
  #     fixed cost). 1m rollback: interval=1m, start_time='2025-05-19' + restore
  #     data/backup_1m/raw_candles.parquet. All temporal windows in the code derive
  #     from this field via interval_minutes (identity at 1m).
  interval: 1h
  # IT: 'limit' ignorato quando 'start_time' settato; finestra effettiva = start_time → oggi.
  # EN: 'limit' is ignored when 'start_time' is set; actual window = start_time → today.
  # IT: a 1h: 2019→oggi ≈ 65k barre orarie (multi-anno; a 1m era 525k = 365 giorni).
  # EN: at 1h: 2019→today ≈ 65k hourly bars (multi-year; at 1m it was 525k = 365 days).
  limit: 525000
  start_time: '2019-01-01'
  output_dir: ./data
  raw_path: ./data/raw_candles.parquet

# IT: Feature macro (FRED) + regime HMM/Markov-Switching su finestra espansibile.
# EN: Macro features (FRED) + HMM/Markov-Switching regime on expanding window.
macro:
  fred_api_key: ''
  history_start: '2018-01-01'
  n_regimes: 3              # IT: 3 regimi (bull/bear/range) | EN: 3 regimes (bull/bear/range)
  embed_dim: 16             # IT: dim embedding regime | EN: regime embedding dim
  # IT: walk-forward RegimeMarkovBTC (clock orario): burn-in 30gg (validato 2026-06-03);
  #     retrain 90gg — su 7 anni il refit mensile expanding costa ~9h (O(t) per refit),
  #     90gg ≈ 3h. Il Hamilton filter resta forward-only ogni ora, cambia solo la
  #     frequenza di ri-stima dei parametri MS (processo lento per natura).
  # EN: RegimeMarkovBTC walk-forward (hourly clock): 30d burn-in (validated 2026-06-03);
  #     90d retrain — over 7 years monthly expanding refits cost ~9h (O(t) per refit),
  #     90d ≈ 3h. The Hamilton filter stays forward-only every hour; only the MS
  #     parameter re-estimation frequency changes (a slow process by nature).
  hmm_burn_in_days: 30
  hmm_retrain_days: 90

# IT: Feature engineering — volume profile, lag, fractional diff, orizzonte target.
# EN: Feature engineering — volume profile, lags, fractional diff, target horizon.
features:
  vp_bins: 30               # IT: bin del Volume Profile | EN: Volume Profile bins
  vp_lookback: 240          # IT: lookback VP (4h) | EN: VP lookback (4h)
  vp_stride: 5
  windows:                  # IT: finestre rolling per statistiche | EN: rolling windows for stats
  - 5
  - 10
  - 20
  - 60
  lag_periods: 5            # IT: lag autoregressivi | EN: autoregressive lags
  frac_diff_d: 0.4          # IT: ordine fractional differencing | EN: fractional differencing order
  forecast_horizon: 30      # IT: h=30 BARRE (=30h a 1h; era 30 min a 1m, fix #2) | EN: h=30 BARS (=30h at 1h; was 30 min at 1m, fix #2)
  # IT: TARGET SPERIMENTALI famiglia vol (pre-registrati in STATUS.md):
  #     "ret"          = path direzionale legacy (bit-invariato, default codice)
  #     "log_rv"       = log realized variance Σr² su h barre (vol-S 2026-06-10:
  #                      PASS a 1h, FAIL a 1m — giudice scripts/dev_vols_qlike.py)
  #     "log_rs_ratio" = asimmetria semivarianza log(RS⁺/RS⁻) su h barre (probe
  #                      2026-06-11 — giudice scripts/dev_vols_rs_judge.py).
  #     NO backtest trading sui modelli vol.
  # EN: EXPERIMENTAL vol-family targets (pre-registered in STATUS.md):
  #     "ret"          = legacy directional path (bit-invariant, code default)
  #     "log_rv"       = log realized variance Σr² over h bars (vol-S 2026-06-10:
  #                      PASS at 1h, FAIL at 1m — judge scripts/dev_vols_qlike.py)
  #     "log_rs_ratio" = semivariance asymmetry log(RS⁺/RS⁻) over h bars (probe
  #                      2026-06-11 — judge scripts/dev_vols_rs_judge.py).
  #     NO trading backtest on vol models.
  target_type: log_rs_ratio
  normalize: true

# IT: Configurazione modello — comune a tutte le arch; gli override stanno in arch/*.yaml.
# EN: Model config — shared across archs; overrides live in arch/*.yaml.
model:
  window_size: 120          # IT: T=120 barre (=5 giorni a 1h; era 2h a 1m — rollback definitivo 2026-06-04, T>120 regressivo su 525k 1m) | EN: T=120 bars (=5 days at 1h; was 2h at 1m — definitive rollback 2026-06-04, T>120 regressed on 525k 1m)
  window_stride: 1          # IT: stride 1 a 1h (~65k barre → max sample; a 1m era 5 su 525k) | EN: stride 1 at 1h (~65k bars → max samples; was 5 at 1m on 525k)
  lstm_hidden: 256
  gru_hidden: 128
  mlp_hidden: 64
  lstm_layers: 2
  dropout: 0.2
  use_macro: true
  use_attention: true
  n_attention_heads: 4
  architecture: itransformer # IT: default arch | EN: default arch
  tft_d_model: 128
  tft_n_heads: 4
  tft_n_layers: 3
  tft_dropout: 0.1
  patch_size: 1
  drop_path_rate: 0.0
  use_multitask: true
  multitask_alpha: 0.7      # IT: peso head direzione | EN: direction head weight
  multitask_threshold: 0.0001
  loss_type: quantile       # IT: 'quantile' | 't_student' | EN: 'quantile' | 't_student'
  n_output_experts: 4       # IT: Mixture-of-Experts heads | EN: Mixture-of-Experts heads
  # IT: RevIN (Kim ICLR 2022) — normalizzazione reversibile per-istanza.
  # EN: RevIN (Kim ICLR 2022) — reversible per-instance normalization.
  # IT: use_revin=true → log_ret/lag_ret_* esclusi dallo scaler globale; denormalize via mean/std finestra.
  # EN: use_revin=true → log_ret/lag_ret_* excluded from global scaler; denormalize via window mean/std.
  # IT: use_revin=false → comportamento legacy (return scalati come le altre feature).
  # EN: use_revin=false → legacy (returns scaled like other features).
  # IT: revin_target_idx = posizione di log_ret in feat_cols, usata per propagare stats target.
  # EN: revin_target_idx = position of log_ret in feat_cols, used to propagate target stats.
  use_revin: false
  revin_target_idx: 9

# IT: Walk-forward validation — k-fold purgato con embargo anti-leakage.
# EN: Walk-forward validation — purged k-fold with anti-leakage embargo.
validation:
  # IT: n_folds=6 dichiarati → 5 fold effettivi: fold 0 viene scartato perché
  #     train_end = fold_size − embargo è strutturalmente < fold_size (vedi
  #     `walk_forward_folds` in quantsys/features/__init__.py:1120). Per ottenere
  #     K fold effettivi servirebbe n_folds=K+1. Lasciato a 6 per coerenza con
  #     MODEL_IMPROVEMENTS fix #4 (documentato comportamento).
  # EN: n_folds=6 declared → 5 effective folds: fold 0 is skipped because
  #     train_end = fold_size − embargo is structurally < fold_size (see
  #     `walk_forward_folds` in quantsys/features/__init__.py:1120). To get K
  #     effective folds you would need n_folds=K+1. Kept at 6 for consistency
  #     with MODEL_IMPROVEMENTS fix #4 (documented behavior).
  n_folds: 6                # IT: 6 dichiarati → 5 effettivi (vedi sopra) | EN: 6 declared → 5 effective (see above)
  embargo_steps: 168        # IT: 168 barre = 1 settimana a 1h (≥ window_size+horizon = 120+30=150; a 1m era 1500 = ~25h) | EN: 168 bars = 1 week at 1h (≥ window_size+horizon = 120+30=150; was 1500 at 1m = ~25h)

# IT: Training loop — ottimizzatore, scheduler, regolarizzazioni anti-overfit.
# EN: Training loop — optimizer, scheduler, anti-overfit regularizers.
training:
  epochs: 200
  batch_size: 64
  gradient_accumulation_steps: 2
  learning_rate: 0.0001
  weight_decay: 1.0e-03   # IT: 1e-3 (era 1e-5) anti-overfit dataset piccolo | EN: 1e-3 (was 1e-5) anti-overfit small dataset
  patience: 15            # IT: 15 (era 30) per evitare overfit silenzioso | EN: 15 (was 30) avoids silent overfit
  # IT: Gap-overfit detector — non attivo nei primi N epoch (train≪val è normale a lr alto).
  # EN: Gap-overfit detector — disabled for first N epochs (train≪val is normal at high lr).
  gap_overfit_warmup_epochs: 10
  gap_overfit_threshold: -0.5
  gap_overfit_streak: 3
  val_fraction: 0.1
  test_fraction: 0.1
  output_dir: ./models/lstm
  use_amp: true             # IT: mixed precision fp16 | EN: fp16 mixed precision
  asymmetry_alpha: 2.0      # IT: penalty errori di segno su large moves | EN: sign-error penalty on large moves
  asymmetry_threshold: 0.004
  crps_weight: 0.1          # IT: peso CRPS aux loss | EN: CRPS aux loss weight
  dv_lambda: 0.3            # IT: peso direction-value loss | EN: direction-value loss weight
  lr_scheduler: cosine      # IT: cosine warm-restart | EN: cosine warm-restart
  lr_scheduler_T0: 10
  lr_scheduler_T_mult: 2
  n_ensemble: 5             # IT: 5 seed ensemble | EN: 5-seed ensemble
  grad_clip_norm: 0.5
  # IT: Mixup temporale (0.0=off). Abilitare solo se train_nll-val_nll < -0.3.
  # EN: Temporal mixup (0.0=off). Enable only if train_nll-val_nll < -0.3.
  mixup_alpha: 0.0
  # IT: Spectral norm solo su mu_head (true) vs su mu/ls2/lnu (false, legacy).
  # EN: Spectral norm on mu_head only (true) vs on mu/ls2/lnu (false, legacy).
  # IT: ATTENZIONE: cambia solo se retrain pulito (checkpoint vecchi incompatibili).
  # EN: WARNING: change only on clean retrain (old checkpoints incompatible).
  sn_on_mu_only: false
  # IT: CRPS rimosso in regime distillation (0.0 = off; teacher fornisce σ²/ν calibrati).
  # EN: CRPS removed during distillation (0.0 = off; teacher provides calibrated σ²/ν).
  crps_distill_weight: 0.0

# IT: Monte Carlo forecast multi-step + GJR-GARCH per dinamica volatilità.
# EN: Monte Carlo multi-step forecast + GJR-GARCH for volatility dynamics.
montecarlo:
  n_paths: 2000             # IT: percorsi simulati | EN: simulated paths
  n_steps: 30
  live_forecast_every: 10   # IT: MC ogni 10 candele in live | EN: MC every 10 candles live
  # IT: ⚠ TODO pivot 1h: parametri GJR-GARCH calibrati su rendimenti BTC 1m — ω ha unità
  #     [varianza/passo] e va RI-STIMATO su rendimenti 1h prima di usare il MC forecast.
  #     MC non è sul critical path del backtest (usa μ/σ del modello, non GARCH).
  # EN: ⚠ 1h-pivot TODO: GJR-GARCH params calibrated on BTC 1m returns — ω has units
  #     [variance/step] and must be RE-FITTED on 1h returns before using the MC forecast.
  #     MC is not on the backtest critical path (uses model μ/σ, not GARCH).
  gjr_omega: 1.2e-05        # IT: GJR-GARCH(1,1,1) params calibrati su BTC 1m | EN: GJR-GARCH(1,1,1) calibrated on BTC 1m
  gjr_alpha: 0.05
  gjr_gamma: 0.065
  gjr_beta: 0.875

# IT: Risk management — Kelly sizing, ATR-based SL/TP, drawdown stop.
# EN: Risk management — Kelly sizing, ATR-based SL/TP, drawdown stop.
risk:
  initial_capital: 10000.0
  max_risk_per_trade: 0.01      # IT: 1% rischio per trade | EN: 1% risk per trade
  sl_atr_mult: 3.0              # IT: SL a 3×ATR | EN: SL at 3×ATR
  tp_rr_ratio: 2.5              # IT: rapporto RR target | EN: RR target ratio
  max_position_pct: 0.25        # IT: max 25% equity per posizione | EN: max 25% equity per position
  max_drawdown_stop: 0.15       # IT: stop totale a -15% DD | EN: kill switch at -15% DD
  max_hold_candles: 60          # IT: max 60 barre = 2.5 giorni a 1h (= 2×horizon; vincolo ≥ forecast_horizon=30; a 1m era 240 = 4h) | EN: max 60 bars = 2.5 days at 1h (= 2×horizon; constraint ≥ forecast_horizon=30; was 240 at 1m = 4h)
  use_trailing_stop: false
  trailing_atr_mult: 3.0
  correlation_window: 10
  max_directional_exposure: 0.6 # IT: max esposizione direzionale | EN: max directional exposure

# IT: Backtest — fee model, slippage e soglie SignalGenerator in spazio raw.
# EN: Backtest — fee model, slippage and SignalGenerator thresholds in raw space.
backtest:
  fee_rate: 0.001               # IT: taker fee 10 bps | EN: taker fee 10 bps
  slippage_rate: 0.0003         # IT: 3 bps base slippage | EN: 3 bps base slippage
  slippage_model: sqrt          # IT: sqrt-impact model | EN: sqrt-impact model
  # IT: Soglie trading in SPAZIO RAW (frazione log-return); denormalize avviene a monte.
  # EN: Trading thresholds in RAW SPACE (log-return fraction); denormalize happens upstream.
  # IT: NON sovrascrivere da arch/*.yaml senza ricalibrare.
  # EN: DO NOT override from arch/*.yaml without recalibrating.
  prob_threshold: 0.52        # IT: ripristino baseline post-bisect / EN: restored baseline post-bisect
  # IT: PIVOT 1h — gate cost-aware: |μ| min = 13 bps (costo round-trip leg); secondo
  #     test pre-registrato a 23 bps. A 1m era 0.0005 (5 bps su orizzonte 30 min).
  # EN: 1h PIVOT — cost-aware gate: min |μ| = 13 bps (round-trip leg cost); second
  #     pre-registered test at 23 bps. At 1m it was 0.0005 (5 bps on 30-min horizon).
  min_expected_ret: 0.0013    # IT: |μ| min raw (=13 bps a h=30 barre 1h) | EN: min raw |μ| (=13 bps at h=30 1h-bars)
  # IT: σ a orizzonte 30 BARRE 1h ≈ √60× quella a 30 min → soglia 0.015×√60 ≈ 0.10.
  #     Da RICALIBRARE empiricamente sui percentili post-denorm del primo training 1h.
  # EN: σ at 30×1h-bar horizon ≈ √60× the 30-min one → threshold 0.015×√60 ≈ 0.10.
  #     RECALIBRATE empirically on post-denorm percentiles of the first 1h training.
  max_sigma: 0.10             # IT: σ max raw a h=30 barre 1h (a 1m era 0.015) | EN: max raw σ at h=30 1h-bars (was 0.015 at 1m)
  conviction_alpha: 0.5       # IT: esponente conviction curve | EN: conviction curve exponent
  # IT: SNR gate |μ|/σ — quick-win #2 contro entry deboli che passano min_expected_ret.
  # EN: SNR gate |μ|/σ — quick-win #2 against weak entries that pass min_expected_ret.
  min_snr: 0.0                # IT: bisect ripristino baseline | EN: bisect baseline restore
  output_dir: ./results/lstm

# IT: Distillation — composizione ensemble eterogeneo per teacher soft-labels.
# EN: Distillation — heterogeneous ensemble composition for teacher soft-labels.
distillation:
  # IT: Single source of truth per scegliere i modelli teacher.
  # EN: Single source of truth to pick teacher models.
  # IT: Esempi: ["itransformer","nhits","tcnmamba"] (default) | ["itransformer","lstm","tcnmamba"] (rollback).
  # EN: Examples: ["itransformer","nhits","tcnmamba"] (default) | ["itransformer","lstm","tcnmamba"] (rollback).
  archs:
    - itransformer
    - nhits
    - tcnmamba
  # IT: Temperatura softmax per pesi ensemble inverse-NLL (più basso = più discriminante).
  #     LASCIATO a 0.05 (≈ uniforme): test 2026-06-04 mostra che val_nll ANTI-correla
  #     col backtest (TCN+Mamba ha miglior val_nll ma 2° peggior Sharpe). Sharpare a
  #     T=0.005 PEGGIORA l'ensemble (Sharpe -20.0 → -23.4). NON abbassare finché il
  #     distribution shift val→test non è risolto. Per live: preferire iTrans standalone (-1.77%).
  # EN: Softmax temperature for inverse-NLL ensemble weights (lower = sharper).
  #     KEPT at 0.05 (≈ uniform): 2026-06-04 test shows val_nll ANTI-correlates with
  #     backtest (TCN+Mamba has best val_nll but 2nd-worst Sharpe). Sharpening to
  #     T=0.005 WORSENS the ensemble (Sharpe -20.0 → -23.4). Do NOT lower until the
  #     val→test distribution shift is fixed. For live: prefer iTrans standalone (-1.77%).
  ensemble_nll_temperature: 0.05

# IT: Dashboard FastAPI/Dash — host locale, timeout subprocess, gzip log streaming.
# EN: Dashboard FastAPI/Dash — local host, subprocess timeout, gzip log streaming.
dashboard:
  host: 127.0.0.1
  port: 8050
  auth_token: ''
  subprocess_timeout_sec: 7200  # IT: 2h per training lunghi | EN: 2h for long training runs
  enable_gzip: true
  log_lines_maxlen: 500
